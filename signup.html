<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cook Book - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-5xl h-[600px] flex shadow-lg bg-white relative">

    <!-- Back Button -->
    <a href="account.html" class="absolute top-4 left-4 w-10 h-10 flex items-center justify-center hover:bg-gray-100 rounded-full">
      <i class="ri-arrow-left-s-line text-2xl"></i>
    </a>

    <!-- Form Section -->
    <div class="w-1/2 p-12 flex flex-col justify-center">
      <div class="text-3xl font-bold mb-8 text-gray-800">Cook Book</div>
      <h1 class="text-2xl font-semibold mb-2 text-gray-700">Create Account</h1>
      <p class="text-sm text-gray-500 mb-6">Sign up with your details to get started.</p>
      
      <!-- Error message container -->
      <div id="error-message" class="text-red-500 mb-4 hidden"></div>
      
      <form id="signup-form" class="mb-4">
        <div class="mb-4">
          <label class="block text-gray-600 mb-1">Email Address</label>
          <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>
        <div class="mb-4">
          <label class="block text-gray-600 mb-1">Password (min 6 characters)</label>
          <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>
        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 font-semibold">Sign Up</button>
      </form>
      <p class="mt-6 text-center text-sm text-gray-600">
        Already have an account? <a href="account.html" class="text-green-600 font-semibold hover:underline">Sign In</a>
      </p>
    </div>
    
    <!-- Image Section -->
    <div class="w-1/2 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836');"></div>
  </div>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      const errorElement = document.getElementById('error-message');
      
      try {
        const response = await fetch('signup.php', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.text();
        
        if (response.ok) {
          window.location.href = 'account.html';
        } else {
          errorElement.textContent = result;
          errorElement.classList.remove('hidden');
        }
      } catch (error) {
        errorElement.textContent = 'Network error. Please try again.';
        errorElement.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
